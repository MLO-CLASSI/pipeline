[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrograph-pipeline"
version = "0.1.0"
description = "Reduction pipeline for the MLO spectrograph"
authors = [
    {name = "Caden Gobat", email = "cgobat@sdsu.edu"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy",
    "ccdproc",
    "numpy",
    "specreduce",
]

[project.scripts]
spectrograph-pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.l1", "pipeline.l2"]
package-dir = {pipeline = "src"}
