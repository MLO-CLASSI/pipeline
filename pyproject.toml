[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classi-pipeline"
version = "0.1.0"
description = "Reduction pipeline for the MLO CLASSI spectrograph"
authors = [
    {name = "Caden Gobat", email = "cgobat@sdsu.edu"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy",
    "ccdproc",
    "numpy",
    "scipy>=1.14",
    "specreduce",
    "synphot>=1.6",
]

[project.optional-dependencies]
test = [
    "matplotlib",
    "pytest>=8",
]

[project.scripts]
classi-pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.l1", "pipeline.l2", "pipeline.l3"]
package-dir = {pipeline = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
